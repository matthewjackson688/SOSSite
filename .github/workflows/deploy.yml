name: Deploy to Fasthosts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Fasthosts
        env:
          FASthOSTS_SSH_KEY: ${{ secrets.FASthOSTS_SSH_KEY }}
        run: |
          printf '%s\n' "$FASthOSTS_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          rsync -av --delete \
            -e "ssh -p 1022 -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='includes/database-config.php' \
            ./ \
            csh3449855@ssh.shareourstory.uk:/home/storage/831/4896831/user/htdocs/
